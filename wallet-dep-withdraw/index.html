<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Депозит / Вывод</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Unbounded";
      src: url("/wallet/Unbounded-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
    }
    body.mode-overlay {
      font-family: "Unbounded", system-ui, sans-serif;
      font-weight: 600;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }
    body.mode-dock {
      font-family: "Google Sans", "Roboto", sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100%;
      padding: 12px;
    }

    /* ——— оверлей ——— */
    .overlay-stack {
      --ww-card-width: 268px;
      --ww-card-radius: 20px;
      --ww-card-pad-y: 10px;
      --ww-card-pad-x: 13px;
      --ww-bar-gap: 16px;
      --ww-stack-gap: 13px;
      --ww-icon-size: 56px;
      --ww-icon-radius: 14px;
      --ww-amt-font: 42px;
      --ww-dep-amt-font: 42px;
      --ww-out-amt-font: 42px;
      --ww-card-lbl-font: 32px;
      --ww-dep-lbl-font: 32px;
      --ww-out-lbl-font: 32px;
      --ww-likes-font: 40px;
      --ww-likes-radius: 18px;
      --ww-dep-amt: #eef9ff;
      --ww-dep-lbl: #7dd3fc;
      --ww-out-empty-amt: #f0a0a0;
      --ww-out-filled-amt: #4ade80;
      --ww-out-lbl: #f0a0a0;
      --ww-out-filled-lbl: #86efac;
      --ww-likes-lbl: #c9a86e;
      --ww-likes-cur: #fff8ee;
      --ww-likes-goal: #9a9288;
      --ww-dep-border: rgba(186, 230, 253, 0.42);
      --ww-dep-bg-1: #2a4256;
      --ww-dep-bg-2: #1a2e42;
      --ww-out-empty-border: rgba(248, 113, 113, 0.42);
      --ww-out-empty-bg-1: #4d2228;
      --ww-out-empty-bg-2: #32161b;
      --ww-out-filled-border: rgba(74, 222, 128, 0.32);
      --ww-out-filled-bg-1: #1a3024;
      --ww-out-filled-bg-2: #102218;
      --ww-likes-border: rgba(212, 175, 95, 0.26);
      --ww-likes-bg-1: #2a2620;
      --ww-likes-bg-2: #1a1713;
      --ww-likes-fill-1: #d4af5f;
      --ww-likes-fill-2: #f0d78c;
      --ww-money-bg-opacity: 1;
      --ww-likes-bg-opacity: 1;
    }
    .bar {
      display: flex;
      align-items: stretch;
      flex-wrap: nowrap;
      gap: var(--ww-bar-gap);
      padding: 6px;
      flex: 0 0 auto;
      max-width: 100%;
    }
    body.mode-dock .overlay-stack { display: none !important; }

    .card {
      position: relative;
      overflow: hidden;
      flex: 0 0 var(--ww-card-width);
      width: var(--ww-card-width);
      max-width: calc((100vw - 16px - 16px) / 2);
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: var(--ww-card-pad-y) var(--ww-card-pad-x);
      border-radius: var(--ww-card-radius);
      border: none;
      background: transparent;
      box-shadow: none;
    }
    /* Не трогать .card-bg — иначе absolute/inset ломается и подложка схлопывается */
    .bar .card > *:not(.card-bg) {
      position: relative;
      z-index: 1;
    }
    .card-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      overflow: hidden;
      /* opacity задаётся inline из JS — в OBS CEF var() часто ломается */
      opacity: 1;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        radial-gradient(ellipse 140% 85% at 50% -35%, #23232b 0%, #1a1a20 55%),
        linear-gradient(148deg, #1e1e26 0%, #131318 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .card.dep .card-bg {
      border-color: var(--ww-dep-border);
      background: linear-gradient(156deg, var(--ww-dep-bg-1) 0%, var(--ww-dep-bg-2) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(186, 230, 253, 0.18),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .card.dep .card-bg::before {
      content: "";
      position: absolute;
      inset: -28%;
      z-index: 0;
      border-radius: 28%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 125% 95% at 10% 6%, var(--ww-dep-bg-1) 0%, var(--ww-dep-bg-2) 54%),
        radial-gradient(ellipse 95% 75% at 96% 94%, var(--ww-dep-bg-1) 0%, var(--ww-dep-bg-2) 48%);
      animation: glowFade 18s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -4s;
    }
    .card.out {
      --out-stop-a: #fecaca;
      --out-stop-b: #ef4444;
      --out-sign-ink: #7f1d1d;
      --out-wallet-body: #3d1a1e;
      --out-wallet-flap: #ffe8e8;
    }
    .card.out .card-bg {
      border-color: var(--ww-out-empty-border);
      background: linear-gradient(204deg, var(--ww-out-empty-bg-1) 0%, var(--ww-out-empty-bg-2) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(248, 113, 113, 0.18),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .card.out .card-bg::before {
      content: "";
      position: absolute;
      inset: -28%;
      z-index: 0;
      border-radius: 28%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 125% 95% at 92% 8%, var(--ww-out-empty-bg-1) 0%, var(--ww-out-empty-bg-2) 54%),
        radial-gradient(ellipse 95% 75% at 4% 92%, var(--ww-out-empty-bg-1) 0%, var(--ww-out-empty-bg-2) 48%);
      animation: glowFade 23s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -11s;
    }
    .card.out.out-has-value {
      --out-stop-a: #86efac;
      --out-stop-b: #16a34a;
      --out-sign-ink: #14532d;
      --out-wallet-body: #1a3d2c;
      --out-wallet-flap: #d9f6e3;
    }
    .card.out.out-has-value .card-bg {
      border-color: var(--ww-out-filled-border);
      background: linear-gradient(168deg, var(--ww-out-filled-bg-1) 0%, var(--ww-out-filled-bg-2) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(74, 222, 128, 0.14),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .card.out.out-has-value .card-bg::before {
      background:
        radial-gradient(ellipse 125% 95% at 92% 8%, var(--ww-out-filled-bg-1) 0%, var(--ww-out-filled-bg-2) 54%),
        radial-gradient(ellipse 95% 75% at 4% 92%, var(--ww-out-filled-bg-1) 0%, var(--ww-out-filled-bg-2) 48%);
    }
    .overlay-stack.no-money-bg .card .card-bg { display: none; }
    .overlay-stack.no-likes-bg .likes-card .card-bg { display: none; }

    .icon-wrap {
      flex-shrink: 0;
      width: var(--ww-icon-size);
      height: var(--ww-icon-size);
      display: grid;
      place-items: center;
      border-radius: var(--ww-icon-radius);
      background: linear-gradient(160deg, #2e2e36 0%, #16161a 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.45) inset,
        0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .overlay-stack.hide-icons .icon-wrap,
    .overlay-stack.side-none .icon-wrap,
    .overlay-stack.side-text .icon-wrap { display: none; }
    .overlay-stack.side-none .card-lbl { display: none !important; }
    .card-lbl {
      display: none;
      flex-shrink: 1;
      min-width: 0;
      max-width: none;
      overflow: visible;
      white-space: nowrap;
      font-size: var(--ww-card-lbl-font);
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1.1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
    }
    .overlay-stack.side-text .card-lbl { display: inline-block; }
    .card.dep .card-lbl {
      color: var(--ww-dep-lbl);
      font-size: var(--ww-dep-lbl-font, var(--ww-card-lbl-font));
    }
    .card.out .card-lbl {
      color: var(--ww-out-lbl);
      font-size: var(--ww-out-lbl-font, var(--ww-card-lbl-font));
    }
    .card.out.out-has-value .card-lbl { color: var(--ww-out-filled-lbl); }
    .overlay-stack.no-glow .card-bg::before,
    .overlay-stack.no-glow .likes-card .card-bg::before {
      animation: none !important;
      filter: brightness(0.9);
    }
    .card.dep .icon-wrap {
      border-color: rgba(56, 189, 248, 0.45);
      background: linear-gradient(160deg, #355a6e 0%, #1a2830 100%);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.45) inset,
        0 0 20px rgba(56, 189, 248, 0.12);
    }
    .card.out .icon-wrap {
      border-color: rgba(248, 113, 113, 0.52);
      background: linear-gradient(160deg, #5c3538 0%, #241618 100%);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.45) inset,
        0 0 20px rgba(248, 113, 113, 0.15);
    }
    .card.out.out-has-value .icon-wrap {
      border-color: rgba(74, 222, 128, 0.42);
      background: linear-gradient(160deg, #2d4a38 0%, #141c16 100%);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.45) inset,
        0 0 20px rgba(74, 222, 128, 0.12);
    }
    .icon-wrap svg {
      width: 46px;
      height: 46px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.75));
    }

    .amt-wrap {
      flex: 0 1 auto;
      min-width: 0;
      max-width: calc(100% - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }
    .amt {
      display: inline-block;
      white-space: nowrap;
      font-size: var(--ww-amt-font);
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      color: #eceae8;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 0 14px rgba(0, 0, 0, 0.55);
    }
    .card.dep .amt {
      font-size: var(--ww-dep-amt-font, var(--ww-amt-font));
      color: var(--ww-dep-amt);
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(125, 211, 252, 0.35);
    }
    .card.out .amt {
      font-size: var(--ww-out-amt-font, var(--ww-amt-font));
      color: var(--ww-out-empty-amt);
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 0 18px rgba(239, 68, 68, 0.22);
    }
    .card.out.out-has-value .amt {
      color: var(--ww-out-filled-amt);
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(74, 222, 128, 0.32);
    }
    .amt .amt-num {
      display: inline-block;
    }
    .amt .amt-suf {
      display: inline-block;
      font-size: 0.64em;
      font-weight: 600;
      opacity: 0.55;
      vertical-align: 0.14em;
      margin-left: 0.05em;
      letter-spacing: 0;
      text-shadow: none;
    }
    /* Свечение: без opacity — иначе в OBS конфликтует с прозрачностью подложки */
    @keyframes glowFade {
      0%, 100% { filter: brightness(0.88); }
      50% { filter: brightness(1.08); }
    }
    @keyframes textSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.86; }
    }
    @keyframes likesRowSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.91; }
    }
    @keyframes textSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.86; }
    }
    @keyframes likesRowSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.91; }
    }
    .card.dep .amt {
      animation: textSoft 16s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -2s;
    }
    .card.out .amt {
      animation: textSoft 20s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -9s;
    }
    .card.dep .amt .amt-suf {
      color: rgba(224, 242, 254, 0.86);
    }
    .card.out .amt .amt-suf {
      color: rgba(220, 150, 150, 0.9);
    }
    .card.out.out-has-value .amt .amt-suf {
      color: rgba(134, 239, 172, 0.92);
    }
    .amt:empty::before {
      content: "—";
      opacity: 0.28;
      font-weight: 600;
    }

    .overlay-stack {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: var(--ww-stack-gap);
      max-width: 100%;
    }
    body.mode-overlay .overlay-stack {
      display: inline-flex;
    }

    .likes-card {
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
      padding: 11px 14px 13px;
      border-radius: var(--ww-likes-radius);
      border: none;
      background: transparent;
      box-shadow: none;
    }
    .likes-card > *:not(.card-bg) {
      position: relative;
      z-index: 1;
    }
    .likes-card .card-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      overflow: hidden;
      opacity: 1;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 1px solid var(--ww-likes-border);
      background: linear-gradient(172deg, var(--ww-likes-bg-1) 0%, var(--ww-likes-bg-2) 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35) inset,
        0 12px 40px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(212, 165, 80, 0.08),
        0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .card .card-bg::after,
    .likes-card .card-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.055;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.9) 0.4px, transparent 0.9px),
        radial-gradient(circle at 78% 65%, rgba(255, 255, 255, 0.75) 0.45px, transparent 1px);
      background-size: 3px 3px, 4px 4px;
    }
    .likes-card .card-bg::before {
      content: "";
      position: absolute;
      inset: -30%;
      z-index: 0;
      border-radius: 24%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 115% 100% at 52% -8%, #3d3428 0%, #221f1a 46%),
        radial-gradient(ellipse 85% 70% at 0% 100%, #2e261c 0%, #1a1713 44%),
        radial-gradient(ellipse 75% 55% at 100% 55%, #282218 0%, #1a1713 42%);
      animation: glowFade 21s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -7s;
    }
    .likes-row {
      --likes-font: var(--ww-likes-font);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .likes-inner {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      min-width: 0;
      animation: likesRowSoft 24s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation-delay: -5s;
    }
    .likes-line {
      flex: 0 1 auto;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: var(--likes-font);
      font-weight: 600;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      color: #ddd4c8;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.82);
    }
    .likes-line .likes-lbl {
      color: var(--ww-likes-lbl);
      letter-spacing: 0.12em;
      font-size: 0.76em;
      font-weight: 600;
      display: inline-block;
    }
    .likes-line .likes-cur-part {
      color: var(--ww-likes-cur);
      display: inline-block;
    }
    .likes-line .likes-goal-part {
      color: var(--ww-likes-goal);
      display: inline-block;
    }
    .likes-inline-thumb {
      flex-shrink: 0;
      width: calc(var(--likes-font) * 1.05);
      height: calc(var(--likes-font) * 1.05);
      display: grid;
      place-items: center;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.55));
    }
    .likes-inline-thumb svg {
      width: 92%;
      height: 92%;
      display: block;
    }
    .likes-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .likes-fill {
      height: 100%;
      width: 0%;
      max-width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ww-likes-fill-1), var(--ww-likes-fill-2));
      box-shadow: 0 0 10px rgba(212, 160, 60, 0.4);
      transition: width 0.35s ease;
    }
    .likes-err {
      margin-top: 6px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f87171;
      line-height: 1.35;
      text-align: center;
    }

    /* Скрытие лайков: место в вёрстке сохраняем (оверлей не «прыгает»). */
    .likes-card.likes-visually-hidden {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ——— док (стиль как у розыгрыша YouTube) ——— */
    .dock {
      display: none;
      flex-direction: column;
      gap: 0;
      max-width: 420px;
      margin: 0 auto;
    }
    body.mode-dock .dock { display: flex; }

    .dock .section {
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .dock .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .dock .section-head .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .dock .section-icon {
      width: 18px;
      height: 18px;
      fill: #7c4dff;
      flex-shrink: 0;
    }
    .dock .section h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
    }
    .dock .hint {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .dock label.field-lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin: 8px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .dock label.field-lbl:first-of-type { margin-top: 0; }

    .dock input[type="text"],
    .dock select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
      font-weight: 400;
    }
    .dock input[type="text"]:focus,
    .dock select:focus {
      outline: none;
      border-color: #7c4dff;
    }
    .dock input::placeholder { color: #666; font-weight: 400; }

    .dock .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0;
    }
    .dock .row > button { flex: 1; min-width: 72px; }

    .dock button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .dock button .btn-ico {
      width: 14px;

  <script>
    const K_BASE = {
      dep: "obs_wallet_dep",
      out: "obs_wallet_out",
      yt: "obs_wallet_yt_url",
      goal: "obs_wallet_like_goal",
      bridge: "obs_wallet_bridge_url",
      hideLikes: "obs_wallet_hide_likes",
      depCurrency: "obs_wallet_dep_currency",
      outCurrency: "obs_wallet_out_currency",
    };
    const tokenScope = (new URLSearchParams(location.search).get("token") || "").trim();
    const scopeSuffix = tokenScope ? ("__" + tokenScope) : "";
    const K = Object.fromEntries(Object.entries(K_BASE).map(([k, v]) => [k, v + scopeSuffix]));
    const K_META = "obs_wallet_yt_meta_v1" + scopeSuffix;
    const DEFAULT_BRIDGE = "";
    let serverUpdatedAt = 0;
    let pushTimer = null;
    let pushing = false;
    let appearanceSettings = { likes_label: "ЦЕЛЬ:" };
    let fxUsdRub = null;
    let fxUpdatedAt = 0;
    let fxPollTimer = null;

    function normalizeCurrency(raw, fallback) {
      const s = String(raw || fallback || "RUB").trim().toUpperCase();
      return s === "USD" || s === "$" ? "USD" : "RUB";
    }

    function readCurrencySettings() {
      try {
        return {
          dep: normalizeCurrency(localStorage.getItem(K.depCurrency), "RUB"),
          out: normalizeCurrency(localStorage.getItem(K.outCurrency), "RUB"),
        };
      } catch (_) {
        return { dep: "RUB", out: "RUB" };
      }
    }

    function writeCurrency(which, code) {
      const cur = normalizeCurrency(code, "RUB");
      const key = which === "dep" ? K.depCurrency : K.outCurrency;
      try { localStorage.setItem(key, cur); } catch (_) {}
      scheduleServerPush();
      syncCurrencyUi();
    }

    function fxApiUrl() {
      const base = bridgeBase(readYtSettings().bridge);
      const u = new URL("/wallet/fx", base.endsWith("/") ? base : base + "/");
      if (tokenScope) u.searchParams.set("token", tokenScope);
      return u.href;
    }

    async function refreshFxRate() {
      try {
        const res = await fetch(fxApiUrl(), { cache: "no-store" });
        const data = await res.json();
        if (!data || !data.ok || !Number.isFinite(data.usd_rub)) throw new Error("bad fx");
        fxUsdRub = Number(data.usd_rub);
        fxUpdatedAt = data.updated_at || Date.now();
      } catch (_) {}
    }

    function syncCurrencyUi() {
      const cur = readCurrencySettings();
      if (depCurrency) depCurrency.value = cur.dep;
      if (outCurrency) outCurrency.value = cur.out;
      if (depPlus) depPlus.placeholder = cur.dep === "USD" ? "1000" : "50";
      if (outPlus) outPlus.placeholder = cur.out === "USD" ? "1000" : "50";
    }

    /** Сумма из поля «+» → тысячи рублей для хранения. */
    function plusToStorageThousands(amount, currency) {
      if (currency === "USD") {
        if (!fxUsdRub || fxUsdRub <= 0) return null;
        return (amount * fxUsdRub) / 1000;
      }
      return amount;
    }

    function bridgeBase(bridge) {
      let b = (bridge || DEFAULT_BRIDGE || location.origin).trim().replace(/\/$/, "");
      if (!b) b = location.origin;
      if (!/^https?:\/\//i.test(b)) b = "http://" + b.replace(/^\/+/, "");
      return b;
    }

    function stateApiUrl() {
      const base = bridgeBase(readYtSettings().bridge);
      const u = new URL("/wallet/state", base.endsWith("/") ? base : base + "/");
      if (tokenScope) u.searchParams.set("token", tokenScope);
      return u.href;
    }

    function readStore() {
      try {
        return {
          dep: localStorage.getItem(K.dep) || "",
          out: localStorage.getItem(K.out) || "",
        };
      } catch (_) {
        return { dep: "", out: "" };
      }
    }

    function readYtSettings() {
      try {
        const b = localStorage.getItem(K.bridge);
        return {
          yt: localStorage.getItem(K.yt) || "",
          goal: localStorage.getItem(K.goal) || "",
          bridge: b && b.trim() ? b : (DEFAULT_BRIDGE || location.origin),
        };
      } catch (_) {
        return { yt: "", goal: "", bridge: location.origin };
      }
    }

    function writeStore(key, val, opts) {
      try { localStorage.setItem(K[key], val); } catch (_) {}
      if (!opts || opts.push !== false) scheduleServerPush();
    }

    function likesGoalHidden() {
      try {
        return localStorage.getItem(K.hideLikes) === "1";
      } catch (_) {
        return false;
      }
    }

    function setHideLikes(hidden, opts) {
      try {
        if (hidden) localStorage.setItem(K.hideLikes, "1");
        else localStorage.removeItem(K.hideLikes);
      } catch (_) {}
      if (!opts || opts.push !== false) {
        // не даём устаревшему GET перетереть локальный toggle до ответа POST
        serverUpdatedAt = Math.max(serverUpdatedAt, Date.now());
        scheduleServerPush(true);
      }
    }

    function collectServerPayload() {
      const y = readYtSettings();
      const s = readStore();
      const cur = readCurrencySettings();
      return {
        dep: s.dep,
        out: s.out,
        yt: y.yt,
        goal: y.goal,
        hideLikes: likesGoalHidden(),
        dep_currency: cur.dep,
        out_currency: cur.out,
      };
    }

    function applyServerState(state, opts) {
      if (!state || typeof state !== "object") return;
      const silent = { push: false };
      if ("dep" in state) {
        try { localStorage.setItem(K.dep, String(state.dep ?? "")); } catch (_) {}
      }
      if ("out" in state) {
        try { localStorage.setItem(K.out, String(state.out ?? "")); } catch (_) {}
      }
      if ("yt" in state) {
        try { localStorage.setItem(K.yt, String(state.yt ?? "")); } catch (_) {}
      }
      if ("goal" in state) {
        try { localStorage.setItem(K.goal, String(state.goal ?? "")); } catch (_) {}
      }
      if ("dep_currency" in state) {
        try { localStorage.setItem(K.depCurrency, normalizeCurrency(state.dep_currency)); } catch (_) {}
      }
      if ("out_currency" in state) {
        try { localStorage.setItem(K.outCurrency, normalizeCurrency(state.out_currency)); } catch (_) {}
      }
      if ("hideLikes" in state) {
        setHideLikes(!!state.hideLikes, silent);
      }
      if (typeof state.updated_at === "number") serverUpdatedAt = state.updated_at;
      if (opts && opts.paint === false) return;
      if (dockMode) {
        paintDock();
        syncHideLikesBtnLabel();
        scheduleChannelMeta();
      } else {
        paintOverlay();
        fetchLikesOnce();
      }
    }

    function scheduleServerPush(immediate) {
      clearTimeout(pushTimer);
      if (immediate) {
        pushServerState();
        return;
      }
      pushTimer = setTimeout(pushServerState, 120);
    }

    async function pushServerState() {
      if (pushing) {
        scheduleServerPush();
        return;
      }
      pushing = true;
      try {
        const res = await fetch(stateApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collectServerPayload()),
          cache: "no-store",
        });
        const data = await res.json().catch(() => ({}));
        if (data && data.state && typeof data.state.updated_at === "number") {
          serverUpdatedAt = data.state.updated_at;
        }
      } catch (_) {
        // offline / bridge down — local cache still works in same CEF context
      } finally {
        pushing = false;
      }
    }

    let pullInFlight = false;
    async function pullServerState() {
      if (pullInFlight) return;
      pullInFlight = true;
      try {
        const res = await fetch(stateApiUrl(), { cache: "no-store" });
        const data = await res.json();
        if (!data || !data.ok || !data.state) return;
        if (typeof data.state.updated_at === "number" && data.state.updated_at <= serverUpdatedAt) {
          return;
        }
        applyServerState(data.state);
      } catch (_) {}
      finally { pullInFlight = false; }
    }

    const q = new URLSearchParams(location.search);
    const dockMode = q.has("dock") || location.hash === "#dock";
    document.body.classList.add(dockMode ? "mode-dock" : "mode-overlay");

    const depDisp = document.getElementById("depDisp");
    const outDisp = document.getElementById("outDisp");
    const depIn = document.getElementById("depIn");
    const outIn = document.getElementById("outIn");
    const ytUrl = document.getElementById("ytUrl");
    const likeGoal = document.getElementById("likeGoal");
    const bridgeUrl = document.getElementById("bridgeUrl");
    const depPlus = document.getElementById("depPlus");
    const outPlus = document.getElementById("outPlus");
    const depPlusBtn = document.getElementById("depPlusBtn");
    const outPlusBtn = document.getElementById("outPlusBtn");
    const depCurrency = document.getElementById("depCurrency");
    const outCurrency = document.getElementById("outCurrency");
    const likesLine = document.getElementById("likesLine");
    const likesFill = document.getElementById("likesFill");
    const likesErr = document.getElementById("likesErr");
    const likesNums = document.getElementById("likesNums");
    const likesDisp = { cur: "—", goal: "0" };

    const outCard = document.getElementById("outCard");
    const hideLikesBtn = document.getElementById("hideLikesBtn");
    let channelMetaTimer = null;

    function loadMetaCache() {
      try {
        const j = JSON.parse(localStorage.getItem(K_META) || "null");
        return j && typeof j === "object" ? j : null;
      } catch (_) {
        return null;
      }
    }
    function saveMetaCache(obj) {
      try {
        localStorage.setItem(K_META, JSON.stringify(obj));
      } catch (_) {}
    }
    function applyMetaBar(url, data) {
      if (!ytChannelBar || !ytChName) return;
      const u = (url || "").trim();
      if (!u || !data || !data.ok) {
        ytChannelBar.hidden = true;
        return;
      }
      const title = (data.title || data.author_name || "").trim();
      const handle = (data.handle || "").trim();
      let avatar = (data.avatar || "").trim();
      // video thumbnail (i.ytimg) — не аватар канала
      if (avatar && !/yt3\.(ggpht|googleusercontent)\.com/i.test(avatar)) {
        avatar = "";
      }
      const showTitle = title || handle || "YouTube";
      ytChName.textContent = showTitle;
      if (ytChHandle) {
        ytChHandle.textContent = handle || (u.startsWith("@") ? u : "—");
      }
      if (ytChAvatar && ytChAvatarFb) {
        if (avatar) {
          ytChAvatar.hidden = false;
          ytChAvatar.src = avatar;
          ytChAvatarFb.style.display = "none";
          ytChAvatar.onerror = () => {
            ytChAvatar.hidden = true;
            ytChAvatarFb.style.display = "flex";
            ytChAvatarFb.textContent = (showTitle || "?").slice(0, 1).toUpperCase();
          };
        } else {
          ytChAvatar.hidden = true;
          ytChAvatarFb.style.display = "flex";
          ytChAvatarFb.textContent = (showTitle || "?").slice(0, 1).toUpperCase();
        }
      }
      ytChannelBar.hidden = false;
    }
    function scheduleChannelMeta() {
      clearTimeout(channelMetaTimer);
      channelMetaTimer = setTimeout(refreshChannelMeta, 600);
    }
    async function refreshChannelMeta() {
      if (!dockMode || !ytChannelBar) return;
      const y = readYtSettings();
      const u = y.yt.trim();
      if (!u) {
        ytChannelBar.hidden = true;
        return;
      }
      const cached = loadMetaCache();
      if (cached && cached.forUrl === u && cached.data) {
        applyMetaBar(u, cached.data);
      }
      const base = bridgeBase(y.bridge);
      try {
        const r = await fetch(
          `${base}/channel_meta?channel=${encodeURIComponent(u)}`,
          { cache: "no-store" }
        );
        const j = await r.json();
        saveMetaCache({ forUrl: u, data: j });
        applyMetaBar(u, j);
      } catch (_) {
        if (!cached || cached.forUrl !== u) {
          ytChannelBar.hidden = true;
        }
      }
    }

    function parseGoal(str) {
      const t = String(str).trim().replace(/\s/g, "").replace(",", ".");
      if (t === "") return 0;
      const n = parseInt(t, 10);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }

    function formatIntRu(n) {
      if (n == null || !Number.isFinite(n)) return "—";
      return new Intl.NumberFormat("ru-RU").format(Math.floor(n));
    }

    function parseRaw(str) {
      const t = String(str).trim().replace(/\s/g, "").replace(",", ".");
      if (t === "" || t === "." || t === "-") return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : null;
    }

    function trimThousands(x) {
      return String(Math.round(Number(x) || 0));
    }

    function trimMillions(m) {
      const t = Math.round((Number(m) || 0) * 100) / 100;
      if (Math.abs(t - Math.round(t)) < 1e-9) return String(Math.round(t));
      let s = t.toFixed(2);
      if (s.endsWith("0") && !s.endsWith(".00")) s = s.slice(0, -1);
      if (s.endsWith(".00")) s = s.slice(0, -3);
      return s;
    }

    /** Сырое число = тысячи рублей: 777 → 777k, 1500 → 1.5kk */
    function formatDisplay(rawStr) {
      const n = parseRaw(rawStr);
      if (n === null) return "";
      const rub = Math.round(n) * 1000;
      if (rub < 1e6) return trimThousands(rub / 1000) + "K";
      return trimMillions(rub / 1e6) + "KK";
    }

    function formatDisplayHtml(rawStr) {
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const n = parseRaw(rawStr);
      if (n === null) return "";
      const rub = Math.round(n) * 1000;
      let numStr;
      let suf;
      if (rub < 1e6) {
        numStr = esc(trimThousands(rub / 1000));
        suf = "k";
      } else {
        numStr = esc(trimMillions(rub / 1e6));
        suf = "kk";
      }
      return (
        '<span class="amt-num">' + numStr + '</span><span class="amt-suf">' + suf + "</span>"
      );
    }

    function formatStoredNum(n) {
      if (!Number.isFinite(n)) return "0";
      return String(Math.round(n));
    }

    /** Дробь в анимации только для зоны kk (от 1000 тысяч = 1kk). */
    function storedUsesFractionalThousands(rawStr) {
      const n = parseRaw(rawStr);
      return n !== null && Math.abs(n) >= 1000;
    }

    const amtAnim = {
      dep: {
        rafId: null,
        from: 0,
        to: 0,
        t0: 0,
        dur: 500,
        targetStr: "",
        seen: false,
        displayN: null,
        fractionalTarget: false,
      },
      out: {
        rafId: null,
        from: 0,
        to: 0,
        t0: 0,
        dur: 500,
        targetStr: "",
        seen: false,
        displayN: null,
        fractionalTarget: false,
      },
    };
    const AMT_BASE_MS = 380;
    const AMT_PER_UNIT_MS = 14;
    const AMT_MAX_MS = 1200;

    function amtEase(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function amtNowN(s, ts) {
      if (s.rafId == null) return s.displayN;
      const u = Math.min(1, (ts - s.t0) / s.dur);
      return s.from + (s.to - s.from) * amtEase(u);
    }

    function cancelAmtAnim(which) {
      const s = amtAnim[which];
      if (s.rafId != null) {
        cancelAnimationFrame(s.rafId);
        s.rafId = null;
      }
    }

    function stepAmtAnim(which, el, ts) {
      const s = amtAnim[which];
      const u = Math.min(1, (ts - s.t0) / s.dur);
      const n = s.from + (s.to - s.from) * amtEase(u);
      s.displayN = n;
      const nShow = s.fractionalTarget ? n : Math.round(n);
      el.innerHTML = formatDisplayHtml(formatStoredNum(nShow));
      fitOverlayAmts();
      if (u < 1) {
        s.rafId = requestAnimationFrame((t2) => stepAmtAnim(which, el, t2));
      } else {
        s.rafId = null;
        s.displayN = s.to;
        const raw = readStore()[which];
        el.innerHTML = formatDisplayHtml(raw);
        s.targetStr = raw;
        fitOverlayAmts();
      }
    }

    function applyAmtWithAnim(which, el) {
      const rawStr = readStore()[which];
      const s = amtAnim[which];
      const nTo = parseRaw(rawStr);

      if (nTo === null) {
        cancelAmtAnim(which);
        el.innerHTML = "";
        s.displayN = null;
        s.targetStr = rawStr;
        s.seen = true;
        fitOverlayAmts();
        return;
      }

      if (!s.seen) {
        el.innerHTML = formatDisplayHtml(rawStr);
        s.displayN = nTo;
        s.targetStr = rawStr;
        s.seen = true;
        fitOverlayAmts();
        return;
      }

      if (rawStr === s.targetStr && s.rafId != null) return;

      if (
        rawStr === s.targetStr &&
        s.rafId == null &&
        s.displayN !== null &&
        Math.abs(s.displayN - nTo) < 1e-6
      ) {
        return;
      }

      const ts = performance.now();
      const nFrom =
        s.rafId != null ? amtNowN(s, ts) : s.displayN !== null ? s.displayN : nTo;

      if (Math.abs(nFrom - nTo) < 1e-9) {
        cancelAmtAnim(which);
        el.innerHTML = formatDisplayHtml(rawStr);
        s.displayN = nTo;
        s.targetStr = rawStr;
        fitOverlayAmts();
        return;
      }

      cancelAmtAnim(which);
      s.from = nFrom;
      s.to = nTo;
      s.t0 = ts;
      s.fractionalTarget = storedUsesFractionalThousands(rawStr);
      s.dur = Math.min(
        AMT_MAX_MS,
        AMT_BASE_MS + AMT_PER_UNIT_MS * Math.sqrt(Math.abs(nTo - nFrom))
      );
      s.targetStr = rawStr;
      s.rafId = requestAnimationFrame((t2) => stepAmtAnim(which, el, t2));
    }

    function applyPlus(which) {
      const inp = which === "dep" ? depIn : outIn;
      const plus = which === "dep" ? depPlus : outPlus;
      const cur = readCurrencySettings();
      const currency = which === "dep" ? cur.dep : cur.out;
      const d = parseRaw(plus.value);
      if (d === null) return;
      const addK = plusToStorageThousands(d, currency);
      if (addK === null) {
        refreshFxRate();
        return;
      }
      const base = parseRaw(inp.value);
      const sum = (base || 0) + addK;
      const s = formatStoredNum(sum);
      writeStore(which, s);
      inp.value = s;
      plus.value = "";
      syncCurrencyUi();
    }

    function fitCard(card) {
      const wrap = card.querySelector(".amt-wrap");
      const amt = card.querySelector(".amt");
      if (!wrap || !amt) return;
      const maxW = wrap.clientWidth;
      if (maxW < 6) return;
      const MIN = 10;
      const MAX = 42;
      amt.style.fontSize = MAX + "px";
      if (amt.scrollWidth <= maxW) return;
      let lo = MIN;
      let hi = MAX;
      let best = MIN;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        amt.style.fontSize = mid + "px";
        if (amt.scrollWidth <= maxW) {
          best = mid;
          lo = mid + 1;
        } else hi = mid - 1;
      }
      amt.style.fontSize = best + "px";
    }

    function fitOverlayAmts() {
      requestAnimationFrame(() => {
        cards().forEach(fitCard);
      });
    }

    function syncOutCardFromRaw(rawStr) {
      if (!outCard) return;
      const n = parseRaw(rawStr);
      outCard.classList.toggle("out-has-value", n !== null && n > 0);
    }

    function applyLikesCardVisibility() {
      const el = document.querySelector(".likes-card");
      if (!el) return;
      const hidden = likesGoalHidden();
      el.classList.toggle("likes-visually-hidden", hidden);
      el.setAttribute("aria-hidden", hidden ? "true" : "false");
    }

    function syncHideLikesBtnLabel() {
      if (!hideLikesBtn) return;
      const hidden = likesGoalHidden();
      hideLikesBtn.classList.toggle("is-hidden", hidden);
      hideLikesBtn.setAttribute("aria-pressed", hidden ? "true" : "false");
      hideLikesBtn.title = hidden ? "Показать цель лайков на оверлее" : "Скрыть цель лайков на оверлее";
      hideLikesBtn.setAttribute(
        "aria-label",
        hidden ? "Показать цель лайков на оверлее" : "Скрыть цель лайков на оверлее"
      );
    }

    function paintOverlay() {
      const { dep, out } = readStore();
      applyAmtWithAnim("dep", depDisp);
      applyAmtWithAnim("out", outDisp);
      syncOutCardFromRaw(out);
      applyLikesCardVisibility();
      paintLikesGoalOnly();
      fitOverlayAmts();
    }

    function paintLikesLineHtml() {
      if (!likesLine) return;
      const lbl = (appearanceSettings && appearanceSettings.likes_label) || "ЦЕЛЬ:";
      likesLine.innerHTML =
        '<span class="likes-lbl">' +
        escapeHtml(lbl) +
        "</span> " +
        '<span class="likes-cur-part">' +
        escapeHtml(likesDisp.cur) +
        "</span>/<span class=\"likes-goal-part\">" +
        escapeHtml(likesDisp.goal) +
        "</span>";
      fitLikesRow();
    }

    async function loadAppearanceSettings() {
      const stack = document.querySelector(".overlay-stack");
      if (!stack || typeof fetchWalletAppearance !== "function") return;
      try {
        const s = await fetchWalletAppearance(tokenScope);
        if (s && typeof s === "object") {
          appearanceSettings = s;
          applyWalletAppearance(stack, s);
          applyLikesCardVisibility();
          paintLikesLineHtml();
          fitOverlayAmts();
        }
      } catch (_) {}
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function paintLikesGoalOnly() {
      const g = parseGoal(readYtSettings().goal);
      likesDisp.goal = formatIntRu(g);
      paintLikesLineHtml();
    }

    function fitLikesRow() {
      if (!likesNums || !likesLine) return;
      const inner = likesNums.querySelector(".likes-inner");
      const MIN = 10;
      const MAX = 42;
      function applyLikesFont(px) {
        likesLine.style.fontSize = px + "px";
        likesNums.style.setProperty("--likes-font", px + "px");
        void likesNums.offsetWidth;
      }
      applyLikesFont(MAX);
      const rowW = likesNums.clientWidth;
      if (rowW < 24) return;
      if (inner && inner.scrollWidth <= rowW) return;
      let lo = MIN;
      let hi = MAX;
      let best = MIN;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        applyLikesFont(mid);
        if (!inner) break;
        if (inner.scrollWidth <= rowW) {
          best = mid;
          lo = mid + 1;
        } else hi = mid - 1;
      }
      applyLikesFont(best);
    }

    let likesPollTimer = null;
    async function fetchLikesOnce() {
      const { yt, goal, bridge } = readYtSettings();
      const g = parseGoal(goal);
      likesDisp.goal = formatIntRu(g);
      if (!yt.trim()) {
        likesDisp.cur = "—";
        likesFill.style.width = "0%";
        likesErr.hidden = true;
        paintLikesLineHtml();
        return;
      }
      const base = bridgeBase(bridge);
      const u = `${base}/status?channel=${encodeURIComponent(yt.trim())}&goal=${encodeURIComponent(g)}`;
      try {
        const r = await fetch(u, { cache: "no-store" });
        const j = await r.json();
        if (typeof j.likes === "number" && Number.isFinite(j.likes)) {
          likesDisp.cur = formatIntRu(j.likes);
          const pct = g > 0 ? Math.min(100, (j.likes / g) * 100) : 0;
          likesFill.style.width = pct + "%";
          likesErr.hidden = true;
        } else {
          likesDisp.cur = "—";
          likesFill.style.width = "0%";
          likesErr.textContent = j.error || "Нет данных о лайках";
          likesErr.hidden = false;
        }
      } catch (e) {
        likesDisp.cur = "—";
        likesFill.style.width = "0%";
        likesErr.textContent = "Бридж не отвечает (запущен python likes_bridge.py?)";
        likesErr.hidden = false;
      }
      paintLikesLineHtml();
    }

    function paintDock() {
      const { dep, out } = readStore();
      depIn.value = dep;
      outIn.value = out;
      const y = readYtSettings();
      ytUrl.value = y.yt;
      likeGoal.value = y.goal;
      bridgeUrl.value = y.bridge || DEFAULT_BRIDGE;
      syncCurrencyUi();
    }

    if (dockMode) {
      const btnWalletSettings = document.getElementById("btnWalletSettings");
      const walletSettingsPanel = document.getElementById("walletSettingsPanel");
      const btnWalletExtras = document.getElementById("btnWalletExtras");
      const walletExtras = document.getElementById("walletExtras");
      if (btnWalletSettings && walletSettingsPanel) {
        btnWalletSettings.addEventListener("click", () => {
          const open = walletSettingsPanel.classList.toggle("open");
          btnWalletSettings.classList.toggle("active", open);
          btnWalletSettings.setAttribute("aria-expanded", open ? "true" : "false");
        });
      }
      if (btnWalletExtras && walletExtras) {
        btnWalletExtras.addEventListener("click", () => {
          const open = walletExtras.classList.toggle("open");
          btnWalletExtras.setAttribute("aria-expanded", open ? "true" : "false");
        });
      }
      paintDock();
      refreshFxRate();
      fxPollTimer = setInterval(refreshFxRate, 5 * 60 * 1000);
      refreshChannelMeta();
      if (depCurrency) {
        depCurrency.addEventListener("change", () => writeCurrency("dep", depCurrency.value));
      }
      if (outCurrency) {
        outCurrency.addEventListener("change", () => writeCurrency("out", outCurrency.value));
      }
      depIn.addEventListener("input", () => writeStore("dep", depIn.value));
      outIn.addEventListener("input", () => writeStore("out", outIn.value));
      ytUrl.addEventListener("input", () => {
        writeStore("yt", ytUrl.value);
        scheduleChannelMeta();
      });
      likeGoal.addEventListener("input", () => writeStore("goal", likeGoal.value));
      bridgeUrl.addEventListener("input", () => {
        writeStore("bridge", bridgeUrl.value, { push: false });
        scheduleChannelMeta();
      });
      depPlusBtn.addEventListener("click", () => applyPlus("dep"));
      outPlusBtn.addEventListener("click", () => applyPlus("out"));
      depPlus.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          applyPlus("dep");
        }
      });
      outPlus.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          applyPlus("out");
        }
      });
      syncHideLikesBtnLabel();
      if (hideLikesBtn) {
        hideLikesBtn.addEventListener("click", () => {
          setHideLikes(!likesGoalHidden());
          syncHideLikesBtnLabel();
        });
      }
      pullServerState().then(() => {
        // если на сервере пусто, а в доке уже есть значения — запушим
        const s = collectServerPayload();
        if (s.dep || s.out || s.yt || s.goal) scheduleServerPush();
      });
      setInterval(pullServerState, 1500);
    } else {
      paintOverlay();
      loadAppearanceSettings();
      setInterval(loadAppearanceSettings, 15000);
      fetchLikesOnce();
      likesPollTimer = setInterval(fetchLikesOnce, 30000);
      pullServerState();
      setInterval(pullServerState, 2000);
      setInterval(paintOverlay, 800);
      window.addEventListener("resize", () => {
        fitOverlayAmts();
        fitLikesRow();
      });
      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => fitOverlayAmts());
        cards().forEach((c) => ro.observe(c));
        const ro2 = new ResizeObserver(() => fitLikesRow());
        ro2.observe(likesNums);
      }
    }
  </script>
</body>
</html>
