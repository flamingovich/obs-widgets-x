<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи — OBS Widgets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #eee; font-family: "Segoe UI", Roboto, sans-serif; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid #333; background: #1a1a1a;
    }
    .header a { color: #bbb; text-decoration: none; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .panel {
      background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px;
    }
    .panel h2 { font-size: 16px; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #444;
      background: #111; color: #fff; margin-bottom: 10px;
    }
    .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin: 12px 0; }
    .checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ddd; }
    button, .btn {
      padding: 9px 14px; border-radius: 8px; border: none; background: #7c4dff; color: #fff;
      cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block;
    }
    .btn-secondary { background: #333; }
    .btn-danger { background: #c62828; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
    th { color: #888; font-weight: 500; }
    code { background: #111; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .perm-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { background: #2a2a2a; border-radius: 999px; padding: 2px 8px; font-size: 11px; color: #ccc; }
    .toast { position: fixed; right: 20px; bottom: 20px; background: #2e7d32; padding: 10px 14px; border-radius: 8px; display: none; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header class="header">
    <strong>Админка — пользователи</strong>
    <div>
      <a href="/">Портал</a> · <a href="/logout">Выйти</a>
    </div>
  </header>
  <main>
    <h1>Управление аккаунтами</h1>

    <section class="panel">
      <h2>Создать пользователя</h2>
      <form id="createForm">
        <label>Логин</label>
        <input name="username" required>
        <label>Пароль</label>
        <input name="password" type="password" required>
        <div class="checks" id="createChecks"></div>
        <button type="submit">Создать</button>
      </form>
    </section>

    <section class="panel">
      <h2>Список пользователей</h2>
      <table>
        <thead>
          <tr>
            <th>Логин</th>
            <th>Токен OBS</th>
            <th>Доступ</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const PERMS = [
      ['access_giveaway', 'Розыгрыши'],
      ['access_roulette', 'Рулетка слотов'],
      ['access_wallet', 'Кошелёк'],
      ['access_wheel', 'Колесо'],
      ['access_dep_calendar', 'Календарь депов'],
    ];

    function renderChecks(container, prefix, values = {}) {
      container.innerHTML = PERMS.map(([key, label]) => `
        <label><input type="checkbox" name="${prefix}_${key}" ${values[key] ? 'checked' : ''}> ${label}</label>
      `).join('');
    }

    function readChecks(container, prefix) {
      const out = {};
      PERMS.forEach(([key]) => {
        out[key] = !!container.querySelector(`[name="${prefix}_${key}"]`)?.checked;
      });
      return out;
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      const data = await res.json();
      const body = document.getElementById('usersBody');
      body.innerHTML = '';
      for (const user of data.users || []) {
        const tr = document.createElement('tr');
        const tags = PERMS.filter(([k]) => user.permissions?.[k]).map(([, l]) => `<span class="tag">${l}</span>`).join('');
        tr.innerHTML = `
          <td><strong>${user.username}</strong>${user.is_admin ? ' (admin)' : ''}</td>
          <td><code>${user.public_token}</code></td>
          <td><div class="perm-tags">${tags || '—'}</div></td>
          <td>${user.is_admin ? '' : `<button class="btn-danger" data-del="${user.id}">Удалить</button>`}</td>
        `;
        body.appendChild(tr);
      }
      body.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Удалить пользователя?')) return;
          await fetch('/api/admin/users/' + btn.dataset.del, { method: 'DELETE' });
          toast('Удалено');
          loadUsers();
        });
      });
    }

    renderChecks(document.getElementById('createChecks'), 'create', {
      access_giveaway: true,
      access_roulette: true,
      access_wallet: true,
      access_wheel: true,
      access_dep_calendar: false,
    });

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        username: fd.get('username'),
        password: fd.get('password'),
        permissions: readChecks(document.getElementById('createChecks'), 'create'),
      };
      const res = await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Ошибка');
        return;
      }
      e.target.reset();
      toast('Пользователь создан');
      loadUsers();
    });

    loadUsers();
  </script>
</body>
</html>
